[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-change"
dynamic = ["version"]
description = "Detect and describe 3D scene changes between two phone videos of the same area."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pydantic>=2.9",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1"]

[project.scripts]
spatial-change = "spatial_change.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "codespell>=2.3",
    "pre-commit>=3.8",
    "hypothesis>=6.100",
]

[tool.hatch.version]
path = "src/spatial_change/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "gpu: needs a CUDA GPU (excluded from CI)",
    "slow: long-running test",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
files = ["src"]

[tool.codespell]
skip = "uv.lock,./data,./runs"
